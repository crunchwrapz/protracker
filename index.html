<!DOCTYPE html>
<html lang="en">

<script>
// Apply the saved theme before the page draws, so it doesn't flash light first.
try{const t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}
</script>

<style>
:root{
  color-scheme:light;
  --bg:#f6f3ec; --card:#fffdf8; --ink:#26302a; --muted:#6b736c; --line:#e3ded2; --line-2:#cfc8b8;
  --input:#fff; --hover:#faf7f0; --cat:#f1ede3; --track:#ece7db; --on-accent:#fff;
  --sage:#5f7a5a; --sage-2:#dfe8d9; --sage-ink:#3f5a3b;
  --terra:#b8613f; --terra-2:#f4e0d6; --terra-ink:#8d4529; --warn-ink:#7a3a22;
  --gold:#c49a3a; --gold-2:#f5ebd2; --gold-ink:#7e6020;
  --sky:#4f7f8c; --sky-2:#dcebee; --sky-ink:#33606b;
  --grey-2:#ece9e1; --grey-ink:#666; --red:#a8452f; --danger-line:#e7c3b8;
  --committed:#a9bd9f; --estimated:#e4d6b3; --scrim:rgba(30,35,30,.45);
  --r:14px;
}
/* Dark palette: same garden colours, lifted for a dark background. Applied when the
   device is in dark mode (unless switched to Light), or when switched to Dark. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#171a17; --card:#212621; --ink:#e7e5dd; --muted:#9ba39c; --line:#323932; --line-2:#4a534a;
  --input:#1b1f1b; --hover:#283028; --cat:#2a302a; --track:#2e342e; --on-accent:#132012;
  --sage:#8fb087; --sage-2:#2b3a29; --sage-ink:#b9d2b1;
  --terra:#d98a68; --terra-2:#46291e; --terra-ink:#f0b89f; --warn-ink:#f3c6b2;
  --gold:#d9b25a; --gold-2:#3b311f; --gold-ink:#e8cc8a;
  --sky:#7fb0bd; --sky-2:#1e3338; --sky-ink:#a9d0da;
  --grey-2:#2e322e; --grey-ink:#b2b7b0; --red:#e3806a; --danger-line:#6b3a2e;
  --committed:#5d7a56; --estimated:#6e603d; --scrim:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171a17; --card:#212621; --ink:#e7e5dd; --muted:#9ba39c; --line:#323932; --line-2:#4a534a;
  --input:#1b1f1b; --hover:#283028; --cat:#2a302a; --track:#2e342e; --on-accent:#132012;
  --sage:#8fb087; --sage-2:#2b3a29; --sage-ink:#b9d2b1;
  --terra:#d98a68; --terra-2:#46291e; --terra-ink:#f0b89f; --warn-ink:#f3c6b2;
  --gold:#d9b25a; --gold-2:#3b311f; --gold-ink:#e8cc8a;
  --sky:#7fb0bd; --sky-2:#1e3338; --sky-ink:#a9d0da;
  --grey-2:#2e322e; --grey-ink:#b2b7b0; --red:#e3806a; --danger-line:#6b3a2e;
  --committed:#5d7a56; --estimated:#6e603d; --scrim:rgba(0,0,0,.6);

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer;color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 90px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}
header.top h1{font-size:24px;line-height:1.1}
header.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}

nav.tabs a{flex:0 0 auto;padding:7px 13px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px;border:1px solid var(--line);background:var(--card)}

.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(2,1fr)}

.kpi .lab{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}

.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:grid;gap:8px}
.tl .row{position:relative}

.scrim.on{display:flex}

.fld{display:grid;gap:4px;margin-bottom:11px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sugg .old{color:var(--muted);text-decoration:line-through}
</style>

<script>
// ---------- schema ----------
const SCHEMA = {
  budget: { label:"budget line", fields:[
    {k:"item",l:"Item",t:"text",req:1},
    {k:"category",l:"Category",t:"select",o:["Design fees","Design oversight","Construction","Plants & materials","Furniture & purchases","Permits & surveys","Contingency"]},
    {k:"vendor",l:"Vendor / who",t:"text"},
    {k:"status",l:"Status",t:"select",o:["Estimate","Quoted","Contracted","Invoiced","Paid"]},
    {k:"estimate",l:"Estimate ($)",t:"number",g:"m"},{k:"committed",l:"Committed ($)",t:"number",g:"m"},{k:"paid",l:"Paid ($)",t:"number",g:"m"},
    {k:"notes",l:"Notes",t:"textarea"}]},
  milestones: { label:"milestone", fields:[
    {k:"title",l:"Milestone",t:"text",req:1},
    {k:"phase",l:"Phase",t:"select",o:["Setup","Design","Bidding","Construction","Close-out"]},
    {k:"status",l:"Status",t:"select",o:["Not started","In progress","Done","Blocked"]},
    {k:"owner",l:"Owner",t:"select",o:["Fi","Us","Contractor","Other"]},
    {k:"planned",l:"Planned date",t:"date",g:"d"},{k:"actual",l:"Actual date",t:"date",g:"d"},
    {k:"sort",l:"Order",t:"number"},
    {k:"notes",l:"Notes",t:"textarea"}]},
  decisions: { label:"decision", fields:[
    {k:"title",l:"Decision",t:"text",req:1},
    {k:"area",l:"Area",t:"select",o:["Budget & scope","Terrace","Pool","Hardscape & paths","Planting","Trees & hedges","Lighting","Fire & water","Seating & dining","Walls & structures","Other"]},
    {k:"status",l:"Status",t:"select",o:["Open","Exploring","Decided","Deferred"]},
    {k:"options",l:"Options being considered",t:"textarea"},
    {k:"choice",l:"What we chose",t:"text"},
    {k:"cost",l:"Cost impact ($)",t:"number",g:"c"},{k:"date",l:"Decided on",t:"date",g:"c"},
    {k:"decidedBy",l:"Signed off by",t:"text"},
    {k:"notes",l:"Notes",t:"textarea"}]},
  questions: { label:"question", fields:[
    {k:"text",l:"Question",t:"textarea",req:1},
    {k:"forWhom",l:"Who needs to answer",t:"select",o:["Fi","Us","Contractor","Other"]},
    {k:"status",l:"Status",t:"select",o:["Open","Answered"]},
    {k:"asked",l:"Raised on",t:"date"},
    {k:"answer",l:"Answer",t:"textarea"}]},
  documents: { label:"file", fields:[
    {k:"title",l:"Title",t:"text",req:1},
    {k:"kind",l:"Type",t:"select",o:["Survey","Design","Contract","Invoice","Quote","Photo","Other"]},
    {k:"from",l:"From",t:"text"},
    {k:"date",l:"Date",t:"date"},
    {k:"link",l:"Link (optional)",t:"text"},
    {k:"notes",l:"Notes",t:"textarea"}]},
  contacts: { label:"contact", fields:[
    {k:"name",l:"Name",t:"text",req:1},{k:"role",l:"Role",t:"text"},{k:"company",l:"Company",t:"text"},
    {k:"phone",l:"Phone",t:"text"},{k:"email",l:"Email",t:"text"},{k:"notes",l:"Notes",t:"textarea"}]},
};
const COLS = Object.keys(SCHEMA);
const state = {meta:{}}; COLS.forEach(c=>state[c]=[]);
let db=null, canWrite=true, view="overview";
const filt={decisions:"Active",questions:"Open"};

// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const usd=n=>"$"+Math.round(num(n)).toLocaleString("en-US");
// Local calendar date (not UTC), so evenings in LA don't roll over to tomorrow.
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=d=>{if(!d)return"";const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3200)}
const forecast=b=>num(b.committed)>0?num(b.committed):num(b.estimate);

// ---------- data (Supabase) ----------
// The publishable key is meant to be public; the database's row-level security
// (supabase/schema.sql) is what limits access to the members list.
const SUPABASE_URL="https://uplxklezrgfnujsdfaoy.supabase.co";
const SUPABASE_KEY="sb_publishable_o7OVwqTwKu-IkjWXF2P5pg_C7Lbvylo";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:"implicit",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null;
const signin={sent:false,email:"",busy:false,err:""};

// Thin layer that mimics the collection/doc API the views were written against
// (onSnapshot / set / delete / add), backed by the single `docs` table.
function makeDb(){
  const store={}, subs={}, errs=[];
  const bucket=c=>store[c]||(store[c]=new Map());
  const colSnap=c=>({metadata:{fromCache:false},docs:[...bucket(c)].map(([id,d])=>({id,data:()=>d}))});
  const docSnap=(c,id)=>{const d=bucket(c).get(id);return {metadata:{fromCache:false},exists:!!d,data:()=>d}};
  const emit=c=>(subs[c]||[]).forEach(f=>f());
  const put=(c,id,d)=>{bucket(c).set(id,d);emit(c)};
  const drop=(c,id)=>{bucket(c).delete(id);emit(c)};
  const sub=(c,f,err)=>{(subs[c]||(subs[c]=[])).push(f);if(err)errs.push(err)};
  const fail=e=>{const x=new Error(e.message||"Request failed");x.code=e.code==="42501"?"invalid_argument":e.code;return x};
  async function loadAll(){
    const {data,error}=await sb.from("docs").select("collection,id,data").range(0,9999);
    if(error) throw fail(error);
    Object.values(store).forEach(m=>m.clear());
    data.forEach(r=>bucket(r.collection).set(r.id,r.data||{}));
    Object.keys(subs).forEach(emit);
  }
  function docRef(c,id){return {
    onSnapshot(cb,err){sub(c,()=>cb(docSnap(c,id)),err)},
    async set(d){const {error}=await sb.from("docs").upsert({collection:c,id,data:d});if(error)throw fail(error);put(c,id,d)},
    async delete(){const {error}=await sb.from("docs").delete().eq("collection",c).eq("id",id);if(error)throw fail(error);drop(c,id)}
  }}
  return {
    collection:c=>({
      onSnapshot(cb,err){sub(c,()=>cb(colSnap(c)),err)},
      doc:id=>docRef(c,id),
      async add(d){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await docRef(c,id).set(d);return {id}}
    }),
    doc:path=>{const [c,id]=path.split("/");return docRef(c,id)},
    async start(){
      // Live updates from the other person; reload everything whenever the connection (re)opens.
      sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
        if(p.eventType==="DELETE"){if(p.old&&p.old.collection)drop(p.old.collection,p.old.id)}
        else if(p.new) put(p.new.collection,p.new.id,p.new.data||{});
      }).subscribe(st=>{if(st==="SUBSCRIBED")loadAll().catch(()=>{})});
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadAll().catch(()=>{})});
      try{await loadAll()}catch(e){errs.forEach(h=>h(e))}
    }
  };
}

// ---------- sign-in ----------
function vSignin(){
  return `<form class="card" style="max-width:440px;margin:30px auto" onsubmit="doSignin(event)">
    <h2 style="font-size:20px;margin-bottom:8px">Sign in</h2>
    <p class="small" style="margin-top:0">You'll stay signed in on this device until you sign out.</p>
    ${signin.err?`<div class="warn">${esc(signin.err)}</div>`:""}
    <div class="fld"><label>Email</label><input name="email" type="email" autocomplete="username" required value="${esc(signin.email)}"></div>
    <div class="fld"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" ${signin.busy?"disabled":""}>${signin.busy?"Signing in…":"Sign in"}</button></form>`;
}
window.doSignin=async e=>{
  e.preventDefault(); const fd=new FormData(e.target);
  signin.email=fd.get("email").trim(); signin.busy=true; signin.err=""; render();
  const {error}=await sb.auth.signInWithPassword({email:signin.email,password:fd.get("password")});
  signin.busy=false;
  if(error){signin.err=/invalid login/i.test(error.message)?"Wrong email or password.":("Couldn't sign in: "+error.message);render();return;}
  location.reload();
};
$("#signout").onclick=async()=>{await sb.auth.signOut();location.reload()};

// ---------- theme ----------
// Auto follows the device's light/dark setting; Dark and Light override it on this device.
const THEMES=["auto","dark","light"], THEME_LABEL={auto:"◐ Auto",dark:"☾ Dark",light:"☀ Light"};
function getTheme(){try{const t=localStorage.getItem("theme");return THEMES.includes(t)?t:"auto"}catch(e){return "auto"}}
function applyTheme(t){
  if(t==="auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t;
  $("#theme").textContent=THEME_LABEL[t];
}
$("#theme").onclick=()=>{
  const t=THEMES[(THEMES.indexOf(getTheme())+1)%THEMES.length];
  try{localStorage.setItem("theme",t)}catch(e){}
  applyTheme(t);
};
applyTheme(getTheme());
$("#changepw").onclick=()=>{

(async function init(){
  const hashErr=new URLSearchParams(location.hash.slice(1)).get("error_description");
  const {data}=await sb.auth.getSession(); session=data.session;
  if(/access_token|error_description/.test(location.hash)){history.replaceState(null,"",location.pathname+"#overview");route();}
  sb.auth.onAuthStateChange((ev,s)=>{session=s;if(ev==="SIGNED_OUT")render();});
  if(!session){
    $("#status").textContent="";
    if(hashErr) signin.err=hashErr;
    render(); return;
  }
  $("#who").style.display=""; $("#whoEmail").textContent=session.user.email;
  render();
  let timer=setTimeout(()=>{$("#status").textContent="Can't reach the project data yet — it may be out of date."},10000);
  const {data:isMember,error:memErr}=await sb.rpc("is_member");
  if(memErr||!isMember){clearTimeout(timer);$("#status").textContent=memErr?"The project data couldn't be loaded right now.":`${session.user.email} isn't on this project's member list.`;return;}
  db=makeDb();
  let loaded=new Set();
  const done=(k,snap)=>{ if(!snap.metadata.fromCache){loaded.add(k); if(loaded.size>=COLS.length+1){clearTimeout(timer);$("#status").textContent="";}} };
  const err=e=>{clearTimeout(timer);$("#status").textContent="The project data couldn't be loaded right now."};
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(s=>{state[c]=s.docs.map(d=>({id:d.id,...d.data()}));done(c,s);render();},err);
  });
  db.doc("meta/project").onSnapshot(s=>{state.meta=s.exists?{...s.data()}:{};done("meta",s);render();},err);
  await db.start();
})();

async function save(col,id,data){
  if(!db){toast("Not connected — can't save.");return false}
  try{ if(id) await db.collection(col).doc(id).set(data); else await db.collection(col).add(data); return true; }
  catch(e){ if(e&&e.code==="invalid_argument"){canWrite=false;toast("You have view-only access, so changes can't be saved.");} else toast("Couldn't save: "+(e&&e.message||"try again")); return false; }
}
async function remove(col,id){
  try{await db.collection(col).doc(id).delete();return true}catch(e){toast("Couldn't delete.");return false}
}

  }
  $("#f").onsubmit=async e=>{
    e.preventDefault(); const form=e.target, fd=new FormData(form);

// ---------- Read with AI ----------
// The Supabase function "read-document" (supabase/functions/read-document) reads the attached file
// and returns SUGGESTED changes. Nothing is saved until the user ticks suggestions and taps Apply.
let aiResult=null, aiWaiting=null;   // aiWaiting: the file whose "Reading…" popup is open
const aiBusy=new Set(), aiReady={};   // reads in progress / finished suggestions not yet applied, by file id
function aiButton(id){
  if(aiBusy.has(id)) return `<button type="button" class="btn sm" onclick="readWithAI('${esc(id)}')">⏳ Reading…</button>`;
  if(aiReady[id]) return `<button type="button" class="btn sm pri" onclick="readWithAI('${esc(id)}')">✨ See suggestions</button>`;
  return `<button type="button" class="btn sm" onclick="readWithAI('${esc(id)}')">✨ Read with AI</button>`;
}
const fieldDef=(col,k)=>SCHEMA[col]&&SCHEMA[col].fields.find(f=>f.k===k);
// Keep only fields the tracker knows, converted to the right type; drop anything invalid.
function cleanFields(c){
  const out=[];
  (c.fields||[]).forEach(({field,value})=>{
    const f=fieldDef(c.collection,field); if(!f) return;
    let v=String(value??"").trim();
    if(f.t==="number"){ if(v===""){v=null}else{v=Number(v.replace(/[$,\s]/g,"")); if(!isFinite(v)) return;} }
    else if(f.t==="select"){ if(!f.o.includes(v)) return; }
    else if(f.t==="date"){ if(v&&!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; }
    out.push({field,value:v,label:f.l,t:f.t});
  });
  return out;
}
const showVal=(v,t)=>v==null||v===""?"(empty)":t==="number"?usd(v):t==="date"?fmtD(v):String(v);
function showReading(d){
  $("#modal").innerHTML=`<h3>Reading “${esc(d.title)}”…</h3>
    <p class="small">Claude is reading the file and comparing it with the tracker. This usually takes under a minute; long documents can take two or three.</p>
    <p class="small">You can close this and keep using the tracker. The button will change to <b>See suggestions</b> when it's done.</p>
    <div class="mfoot"><div></div><button class="btn" onclick="closeForm()">Close</button></div>`;
  $("#scrim").classList.add("on"); aiWaiting=d.id;
}
window.readWithAI=async (id,again)=>{
  const d=state.documents.find(x=>x.id===id); if(!d) return;
  if(aiBusy.has(id)){showReading(d);return;}                                  // already reading: just show progress
  if(aiReady[id]&&!again){aiResult=aiReady[id];renderReview();return;}       // finished earlier: show the results
  delete aiReady[id]; aiBusy.add(id); render(); showReading(d);
  const {data,error}=await sb.functions.invoke("read-document",{body:{documentId:id}});
  aiBusy.delete(id);
  const watching=aiWaiting===id&&$("#scrim").classList.contains("on");
  if(error){
    let msg=error.message;
    try{const b=await error.context.json(); if(b&&b.error) msg=b.error;}catch(e){}
    render();
    if(watching) $("#modal").innerHTML=`<h3>Couldn't read the file</h3><div class="warn">${esc(msg)}</div><div class="mfoot"><div></div><button class="btn" onclick="closeForm()">Close</button></div>`;
    else toast(`Couldn't read “${d.title}”: ${msg}`);
    return;
  }
  aiReady[id]={documentId:id,title:d.title,...data}; render();
  if(watching){aiResult=aiReady[id];renderReview();}
  else toast(`Suggestions are ready for “${d.title}”.`);
};
function renderReview(){
  const r=aiResult, ch=r.changes||[]; const colLabel=c=>SCHEMA[c]?SCHEMA[c].label:c;
  const items=ch.map((c,i)=>{
    const existing=c.action==="update"?(state[c.collection]||[]).find(x=>x.id===c.id):null;
    const fields=cleanFields(c);
    const ok=(c.action==="add"||existing)&&fields.length;
    const name=existing&&(existing.title||existing.item||existing.text||existing.name);
    return `<label class="sugg${ok?"":" off"}"><input type="checkbox" data-i="${i}" ${ok?"checked":"disabled"}>
      <div><div class="t">${esc(c.label)}</div>
      <div class="small">${c.action==="add"?"Add":"Update"} ${esc(colLabel(c.collection))}${name?` · ${esc(name)}`:""}${!ok?" · can't apply (record not found or no valid fields)":""}</div>
      <ul>${fields.map(f=>`<li><b>${esc(f.label)}:</b> ${existing?`<span class="old">${esc(showVal(existing[f.field],f.t))}</span> → `:""}${esc(showVal(f.value,f.t))}</li>`).join("")}</ul>
      <div class="small" style="font-style:italic">${esc(c.reason)}</div></div></label>`;
  }).join("");
  $("#modal").innerHTML=`<h3>Suggested updates</h3>
    <p class="small" style="margin-top:-6px">From “${esc(r.title)}”. Untick anything you don't want, then apply.</p>
    <p class="pre">${esc(r.summary||"")}</p>
    ${items||`<div class="empty">No changes suggested for this document.</div>`}
    <div class="mfoot"><div><button class="btn" onclick="readWithAI('${esc(r.documentId)}',true)">Read again</button></div><div style="display:flex;gap:8px"><button class="btn" onclick="closeForm()">Close</button>${ch.length?`<button class="btn pri" id="applyAI">Apply selected</button>`:""}</div></div>`;
  $("#scrim").classList.add("on");
  if($("#applyAI")) $("#applyAI").onclick=applyAI;
}
async function applyAI(){
  const btn=$("#applyAI"); btn.disabled=true; btn.textContent="Applying…";
  const picks=[...document.querySelectorAll(".sugg input:checked")].map(x=>aiResult.changes[+x.dataset.i]);
  let n=0;
  for(const c of picks){
    const existing=c.action==="update"?(state[c.collection]||[]).find(x=>x.id===c.id):null;
    if(c.action==="update"&&!existing) continue;
    const out={}; if(existing){const {id:_id,...rest}=existing; Object.assign(out,rest);}
    cleanFields(c).forEach(f=>{out[f.field]=f.value});
    out.updated=today();
    if(await save(c.collection,existing?existing.id:newId(),out)) n++;
  }
  delete aiReady[aiResult.documentId];
  closeForm(); render(); toast(n?`Applied ${n} change${n===1?"":"s"}.`:"Nothing applied.");
}

}
function vSchedule(){
  const ms=[...state.milestones].sort(msSort); let h="";
  PH.forEach(p=>{const it=ms.filter(m=>(m.phase||"Setup")===p); if(it.length) h+=`<div class="phase">${p}</div><div class="tl">${it.map(msRow).join("")}</div>`;});
  return `<div class="sec-h"><h2>Schedule</h2><button class="btn pri" onclick="openForm('milestones')">+ Add milestone</button></div>${h||`<div class="empty">No milestones yet.</div>`}`;
}
function dRow(d){
  return `<div class="row" data-col="decisions" data-id="${esc(d.id)}"><div class="flex"><div><div class="small">${esc(d.area||"")}</div><div class="t">${esc(d.title)}</div>
  ${d.choice?`<div class="m"><b>Chose:</b> ${esc(d.choice)}${num(d.cost)?` · ${usd(d.cost)}`:""}${d.decidedBy?` · ${esc(d.decidedBy)}`:""}${d.date?` · ${fmtD(d.date)}`:""}</div>`:""}
  ${d.options?`<div class="m pre">${esc(d.options)}</div>`:""}${d.notes?`<div class="m pre" style="font-style:italic">${esc(d.notes)}</div>`:""}</div>${pill(d.status)}</div></div>`;
}
function filterBar(key,opts){return `<div class="filters">${opts.map(o=>`<button class="${filt[key]===o?"on":""}" onclick="setF('${key}','${o}')">${o}</button>`).join("")}</div>`}
window.setF=(k,v)=>{filt[k]=v;render()};
function vDecisions(){
  const f=filt.decisions;
  const areas=SCHEMA.decisions.fields.find(x=>x.k==="area").o;
  let list=state.decisions.filter(d=>f==="All"||(f==="Active"?(d.status==="Open"||d.status==="Exploring"):d.status===f));
  list.sort((a,b)=>areas.indexOf(a.area)-areas.indexOf(b.area)||(a.title||"").localeCompare(b.title||""));
  return `<div class="sec-h"><h2>Decisions &amp; selections</h2><button class="btn pri" onclick="openForm('decisions',null,{status:'Open'})">+ Add</button></div>
  <p class="small" style="margin-top:-4px">Every design choice, what you picked, what it costs and who signed off. Your record of what was agreed.</p>
  ${filterBar("decisions",["Active","Decided","Deferred","All"])}
  <div class="list">${list.map(dRow).join("")||`<div class="empty">Nothing here.</div>`}</div>`;
}
function qRow(q){
  return `<div class="row" data-col="questions" data-id="${esc(q.id)}"><div class="flex"><div><div class="t pre" style="font-weight:500">${esc(q.text)}</div>
  <div class="m">For ${esc(q.forWhom||"—")}${q.asked?` · raised ${fmtD(q.asked)}`:""}</div>${q.answer?`<div class="m pre"><b>Answer:</b> ${esc(q.answer)}</div>`:""}</div>${pill(q.status)}</div></div>`;
}
function vQuestions(){
  const f=filt.questions; const list=state.questions.filter(q=>f==="All"||q.status===f).sort((a,b)=>String(b.asked||"").localeCompare(String(a.asked||"")));
  return `<div class="sec-h"><h2>Questions &amp; follow-ups</h2><button class="btn pri" onclick="openForm('questions',null,{status:'Open',forWhom:'Fi',asked:'${today()}'})">+ Add</button></div>
  <p class="small" style="margin-top:-4px">Things to raise with Fi at the next meeting, and things she's waiting on from you.</p>
  ${filterBar("questions",["Open","Answered","All"])}
  <div class="list">${list.map(qRow).join("")||`<div class="empty">Nothing here.</div>`}</div>`;
}
function vFiles(){
  const docs=[...state.documents].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  return `<div class="sec-h"><h2>Files</h2><button class="btn pri" onclick="openForm('documents',null,{date:'${today()}'})">+ Add</button></div>
  <p class="small" style="margin-top:-4px">Every drawing, contract and invoice. Tap one to attach or replace its file.</p>
  <div class="list">${docs.map(d=>`<div class="row" data-col="documents" data-id="${esc(d.id)}"><div class="flex"><div><div class="t">${esc(d.title)}</div>
    <div class="m">${esc(d.from||"")}${d.date?` · ${fmtD(d.date)}`:""}${d.link&&/^https?:\/\//.test(d.link)?` · <a class="lnk" href="${esc(d.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">link</a>`:""}</div>
    ${d.file?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="openFile('${esc(d.file)}')">📎 Open ${esc(d.fileName||"file")}${d.fileSize?` · ${fmtSize(d.fileSize)}`:""}</button>${aiButton(d.id)}</div>`:`<div class="small" style="margin-top:6px">No file attached yet. Tap to attach one.</div>`}
    ${d.notes?`<div class="m pre">${esc(d.notes)}</div>`:""}</div>${pill(d.kind)}</div></div>`).join("")||`<div class="empty">No files yet.</div>`}</div>
  <div class="sec"><div class="sec-h"><h2>Contacts</h2><button class="btn pri" onclick="openForm('contacts')">+ Add</button></div>
  <div class="list">${state.contacts.map(c=>`<div class="row" data-col="contacts" data-id="${esc(c.id)}"><div class="t">${esc(c.name)} <span class="small" style="font-weight:400">${esc(c.role||"")}</span></div>
    <div class="m">${esc(c.company||"")}${c.phone?` · ${esc(c.phone)}`:""}${c.email?` · ${esc(c.email)}`:""}</div>${c.notes?`<div class="m pre">${esc(c.notes)}</div>`:""}</div>`).join("")||`<div class="empty">No contacts yet.</div>`}</div></div>`;
}
window.openForm=openForm;

const VIEWS={overview:vOverview,budget:vBudget,schedule:vSchedule,decisions:vDecisions,questions:vQuestions,files:vFiles};
function render(){
  $("#tabs").style.display=session?"":"none";
  if(!session){$("#view").innerHTML=vSignin();return;}
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===view));
  $("#view").innerHTML=VIEWS[view]();
}
$("#view").addEventListener("click",e=>{
  const r=e.target.closest("[data-col][data-id]"); if(!r||e.target.closest("button,a")) return;
  openForm(r.dataset.col,r.dataset.id);
});
function route(){const h=location.hash.slice(1);view=VIEWS[h]?h:"overview";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
